<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-sphere width = "2" radius ="2" position = "0 2 0" color = "yellow" theta-start="0" theta-length="90"></a-sphere>
      <a-sphere width = "2" radius ="2" position = "0 2 0" rotation="260" color = "yellow" theta-start="0" theta-length="90" side = "double"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
